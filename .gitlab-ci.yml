# .gitlab-ci.yml
image: docker:24.0.2

services:
  - name: docker:dind
    alias: dind

variables:
  # Docker-in-Docker config
  DOCKER_HOST: tcp://dind:2375
  DOCKER_TLS_CERTDIR: ""
  # Répertoire de build React
  BUILD_DIR: build
  # Nom de l'image Docker
  IMAGE_NAME: oms-frontend-ci

# Pipeline uniquement sur la branche ci/cd
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "ci/cd"'
      when: always
    - when: never

stages:
  - build
  - docker-test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Étape 1 : Build de l'application React
build_app:
  stage: build
  image: node:lts
  before_script:
    - npm cache clean --force
  script:
    - npm install --frozen-lockfile
    - npm run build
  artifacts:
    paths:
      - $BUILD_DIR
    expire_in: 1 week

# Étape 2 : Build de l'image Docker et test
docker_build:
  stage: docker-test
  needs:
    - job: build_app
      artifacts: true
  script:
    # 1) Build de l'image Docker avec le build React
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .

    # 2) Lancer le container
    - docker run -d --name oms-test -p 8080:80 $IMAGE_NAME:$CI_COMMIT_SHA

    # 3) Attendre que le service soit prêt
    - |
      echo "🔄 Attente du démarrage du service..."
      for i in $(seq 1 15); do
        if docker exec oms-test test -f /usr/share/nginx/html/index.html; then
          echo "✅ Fichiers détectés, test de connexion..."
          sleep 2
          if docker exec oms-test curl --retry 3 --retry-delay 2 --fail --connect-timeout 5 http://localhost; then
            echo "✅ Service ready et accessible"
            break
          fi
        fi
        echo "⏳ Tentative $i/15 - En attente..."
        sleep 3
        if [ $i -eq 15 ]; then
          echo "❌ Timeout: le service n'a pas démarré"
          docker logs oms-test
          exit 1
        fi
      done

    # 4) Validation finale
    - echo "🔍 Test final de l'application..."
    - docker exec oms-test curl --fail --silent --show-error http://localhost
    - echo "✅ Application validée avec succès"

  after_script:
    - echo "🧹 Nettoyage des containers..."
    - docker stop oms-test || true
    - docker rm oms-test || true
    - docker rmi $IMAGE_NAME:$CI_COMMIT_SHA || true
