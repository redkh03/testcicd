# .gitlab-ci.yml
image: docker:24.0.2

services:
  - name: docker:dind
    alias: dind

variables:
  # Pour Docker-in-Docker
  DOCKER_HOST: tcp://dind:2375
  DOCKER_TLS_CERTDIR: ""
  # Pour ton build React
  BUILD_DIR: build
  # Nom et tag de ton image
  IMAGE_NAME: oms-frontend-ci

# Ne créer la pipeline que sur push de la branche Workflows-CI-CD
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "Workflows-CI-CD"'
      when: always
    - when: never

stages:
  - build
  - docker-test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Tests (désactivé temporairement - décommentez quand prêt)
