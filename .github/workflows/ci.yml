name: CI

on:
  push:
    branches:
      - ci/cd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found, running npm ci"
            npm ci
          else
            echo "No package-lock.json found, running npm install"
            npm install
          fi

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  docker-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t oms-frontend-ci:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d --name oms-test -p 8080:80 oms-frontend-ci:${{ github.sha }}
          # Wait for the container to be ready
          for i in $(seq 1 15); do
            if docker exec oms-test test -f /usr/share/nginx/html/index.html; then
              echo "Files found, testing connection..."
              sleep 2
              if curl --retry 3 --retry-delay 2 --fail --connect-timeout 5 http://localhost:8080; then
                echo "Service ready and accessible"
                break
              fi
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 3
            if [ $i -eq 15 ]; then
              echo "Timeout: service did not start"
              docker logs oms-test
              exit 1
            fi
          done

      - name: Final test
        run: curl --fail --silent --show-error http://localhost:8080

      - name: Cleanup
        run: |
          docker stop oms-test || true
          docker rm oms-test || true
          docker rmi oms-frontend-ci:${{ github.sha }} || true
