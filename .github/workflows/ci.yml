name: Build & Docker Test

on:
  push:
    branches:
      - ci/cd

jobs:
  build_app:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/

  docker_build:
    name: Docker Build & Run Test
    runs-on: ubuntu-latest
    needs: build_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t oms-frontend-ci:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name oms-test -p 8080:80 oms-frontend-ci:${{ github.sha }}

      - name: Wait for service to be ready
        run: |
          echo "🔄 Attente du démarrage du service..."
          for i in {1..15}; do
            if docker exec oms-test test -f /usr/share/nginx/html/index.html; then
              echo "✅ Fichiers détectés"
              sleep 2
              if curl --retry 3 --retry-delay 2 --fail --connect-timeout 5 http://localhost:8080; then
                echo "✅ Service ready et accessible"
                break
              fi
            fi
            echo "⏳ Tentative $i/15 - En attente..."
            sleep 3
            if [ $i -eq 15 ]; then
              echo "❌ Timeout: le service n'a pas démarré"
              docker logs oms-test
              exit 1
            fi
          done

      - name: Final validation
        run: curl --fail --silent --show-error http://localhost:8080

      - name: Cleanup Docker
        if: always()
        run: |
          echo "🧹 Nettoyage..."
          docker stop oms-test || true
          docker rm oms-test || true
          docker rmi oms-frontend-ci:${{ github.sha }} || true
