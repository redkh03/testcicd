name: CI

on:
  push:
    branches:
      - ci/cd

jobs:
  build_app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install dependencies and build React app
        working-directory: oms-pandemic-dashboard
        run: |
          npm cache clean --force
          npm install --frozen-lockfile
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: oms-pandemic-dashboard/build

  docker_build:
    runs-on: ubuntu-latest
    needs: build_app
    services:
      docker:
        image: docker:24.0.2
        options: --privileged
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: oms-pandemic-dashboard/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: oms-pandemic-dashboard
        run: docker build -t oms-frontend-ci:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d --name oms-test -p 8080:80 oms-frontend-ci:${{ github.sha }}
          for i in $(seq 1 15); do
            if docker exec oms-test test -f /usr/share/nginx/html/index.html; then
              echo "Files detected, testing connection..."
              sleep 2
              if curl --retry 3 --retry-delay 2 --fail --connect-timeout 5 http://localhost:8080; then
                echo "Service ready and accessible"
                break
              fi
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 3
            if [ $i -eq 15 ]; then
              echo "Timeout: service did not start"
              docker logs oms-test
              exit 1
            fi
          done

      - name: Final test
        run: curl --fail --silent --show-error http://localhost:8080

      - name: Cleanup
        run: |
          docker stop oms-test || true
          docker rm oms-test || true
          docker rmi oms-frontend-ci:${{ github.sha }} || true
